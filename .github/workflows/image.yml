name: Image

# ghcr.io/ajchemist/emacs-camp, which the Killercoda scenario runs.
on:
  push:
    branches: [main]
    paths: [lisp/**, extras/**, sync.el, compile.el, module.nix, flake.nix, flake.lock, Dockerfile, .github/workflows/image.yml]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # nightly (03:00 KST) from main HEAD, so MELPA packages stay fresh

# A newer push supersedes a running build, so latest is never overwritten by an older commit.
concurrency:
  group: image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          # Layer cache: the Emacs build layer (Dockerfile) is reused until flake.lock changes.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          context: .
          file: Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/emacs-camp:latest
