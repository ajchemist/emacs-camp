name: Image

# ghcr.io/ajchemist/emacs-camp, which the Killercoda scenario runs.
on:
  push:
    branches: [main]
    paths: [lisp/**, extras/**, sync.el, compile.el, module.nix, flake.nix, flake.lock, Dockerfile, .github/workflows/image.yml]
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # nightly (03:00 KST) from main HEAD, so MELPA packages stay fresh

# A newer push supersedes a running build, so latest is never overwritten by an older commit.
concurrency:
  group: image
  cancel-in-progress: true

jobs:
  # Each architecture on its own native runner (no QEMU: the Emacs build runs
  # under Nix), pushed as <tag>-<arch>; `merge` joins them into :latest and
  # :debian manifest lists.
  image:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/emacs-camp
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      # Layer cache: the Emacs build layer (Dockerfile) is reused until flake.lock changes.
      - uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          context: .
          target: scratch
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:latest-${{ matrix.arch }}
      - uses: docker/build-push-action@v6
        with:
          cache-from: type=gha,scope=${{ matrix.arch }}
          context: .
          target: debian
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:debian-${{ matrix.arch }}

  merge:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/emacs-camp
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - run: |
          for t in latest debian; do
            docker buildx imagetools create -t "$IMAGE:$t" "$IMAGE:$t-amd64" "$IMAGE:$t-arm64"
          done
