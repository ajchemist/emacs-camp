name: Demo image

# ghcr.io/ajchemist/emacs-camp-demo, which the Killercoda scenario runs.
on:
  push:
    branches: [main]
    paths: [lisp/**, sync.el, demo/**, .github/workflows/demo-image.yml]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1" # weekly, so MELPA packages stay fresh

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: demo/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/emacs-camp-demo:latest
