name: CI

on:
  push:
    branches: [main]
    paths: &code
      # What CI exercises; docs and notes alone do not start a run.
      - lisp/**
      - ci/**
      - sync.el
      - module.nix
      - flake.nix
      - flake.lock
      - .github/workflows/ci.yml
  pull_request:
    paths: *code
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # once a week, since MELPA keeps changing

jobs:
  # Static checks: all flake outputs evaluate, lisp/ byte-compiles with
  # nix-basecamp's Emacs (warnings fail), and the CI helper scripts parse.
  lint:
    runs-on: ubuntu-latest
    outputs:
      emacs-version: ${{ steps.emacs.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Evaluate all outputs
        run: nix flake check --all-systems --no-build
      - name: Byte-compile lisp/ against basecamp's Emacs (module check)
        run: nix build .#checks.x86_64-linux.home
      - name: basecamp's Emacs version (Windows installs the same one)
        id: emacs
        run: echo "version=$(nix eval --raw .#packages.x86_64-linux.emacs.version)" >> "$GITHUB_OUTPUT"
      - name: Helpers parse
        run: |
          python3 -m py_compile ci/mock-acp-agent.py ci/test_activation.py
          bash -n ci/e2e-deploy.sh ci/eln-vetting.sh

  # The module-free path on every OS: lisp/ copied in, the package sync, a
  # module-style byte-compile, then smoke + agent-shell E2E. Emacs is
  # basecamp's (packages.<system>.emacs); Windows, where Nix does not run,
  # takes GNU's build of the same version.
  runtime:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: lint
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
        if: runner.os != 'Windows'
      - name: Emacs from basecamp
        if: runner.os != 'Windows'
        run: |
          nix build .#emacs -o "$RUNNER_TEMP/emacs"
          echo "$RUNNER_TEMP/emacs/bin" >> "$GITHUB_PATH"
      - name: Emacs (Windows, GNU build of basecamp's version)
        if: runner.os == 'Windows'
        env:
          V: ${{ needs.lint.outputs.emacs-version }}
        run: |
          # ftpmirror.gnu.org (the redirector) is at times unreachable from runners.
          f="emacs/windows/emacs-${V%%.*}/emacs-$V.zip"
          curl -sSfL --connect-timeout 20 -o "$RUNNER_TEMP/emacs.zip" "https://ftpmirror.gnu.org/$f" \
            || curl -sSfL -o "$RUNNER_TEMP/emacs.zip" "https://ftp.gnu.org/gnu/$f"
          unzip -q "$RUNNER_TEMP/emacs.zip" -d /c/emacs
          echo 'C:\emacs\bin' >> "$GITHUB_PATH"
      - name: Lay out an init directory
        run: |
          d="$RUNNER_TEMP/emacs.d"; mkdir -p "$d"; cp lisp/*.el "$d/"
          echo "D=$d" >> "$GITHUB_ENV"
          echo "WEEK=$(date -u +%G-%V)" >> "$GITHUB_ENV"
          emacs --version | head -1
      # Cache elpa/ by OS, package list and ISO week so pushes and PRs avoid
      # fetching MELPA; the weekly cron starts clean, so drift still surfaces.
      - name: Cache elpa/
        if: github.event_name != 'schedule'
        uses: actions/cache@v6
        with:
          path: ${{ env.D }}/elpa
          key: elpa-${{ matrix.os }}-${{ hashFiles('lisp/*.el') }}-${{ env.WEEK }}
      - name: Package sync (installs, compiles, quickstart)
        run: |
          s=$SECONDS
          # On Windows runners PATH resolves gpg to Git for Windows' MSYS
          # build, which rejects every GNU/NonGNU ELPA signature
          # (bad-signature on archive-contents.sig), and compat comes from
          # there. CI turns the check off; on a desktop, use Gpg4win.
          pre='()'; [ "$RUNNER_OS" = Windows ] && pre='(setq package-check-signature nil)'
          emacs --batch --init-directory "$D" --eval "$pre" -l sync.el
          echo "| ${{ matrix.os }} package sync | $((SECONDS - s))s |" >> "$GITHUB_STEP_SUMMARY"
      - name: Byte-compile as the module does
        # Only the files from lisp/, matching the module, and not the
        # package-quickstart.el that the sync wrote beside them.
        run: emacs --batch --eval '(progn (require (quote use-package)) (setq use-package-ensure-function (quote ignore) byte-compile-error-on-warn t))' -f batch-byte-compile $(for f in lisp/*.el; do echo "$D/${f#lisp/}"; done)
      - name: Native-compile as the module does
        # emacsCampNativeCompile: the linked sources, :ensure off.
        run: |
          for f in lisp/*.el; do
            emacs --batch --init-directory "$D" \
              --eval '(progn (require (quote use-package)) (setq use-package-ensure-function (quote ignore)))' \
              --eval '(unless (native-comp-available-p) (kill-emacs 0))' \
              -f batch-native-compile "$D/${f#lisp/}"
          done
      - name: Smoke
        env:
          ECAMP_SMOKE_LABEL: runtime ${{ matrix.os }}
        run: emacs --batch --init-directory "$D" -l ci/smoke.el
      - name: agent-shell E2E (mock ACP agent)
        run: emacs --batch --init-directory "$D" -l ci/agent-shell-e2e.el

  # The real product flow: apply nix-basecamp's builder and this module to
  # the runner, then rerun smoke and E2E on the installed result.
  deploy:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Deploy onto the runner
        run: ./ci/e2e-deploy.sh
      - name: Smoke (deployed config)
        env:
          ECAMP_SMOKE_LABEL: deployed ${{ matrix.os }}
        run: '"$EMACS" --batch --init-directory "$HOME/.config/emacs" -l ci/smoke.el'
      - name: agent-shell E2E (mock ACP agent)
        run: '"$EMACS" --batch --init-directory "$HOME/.config/emacs" -l ci/agent-shell-e2e.el'
      - name: Re-deploy (idempotent; prunes eln-cache of other Emacs builds)
        run: |
          mkdir -p "$HOME/.config/emacs/eln-cache/29.1-0000000000/stale"
          ./ci/e2e-deploy.sh
          test ! -e "$HOME/.config/emacs/eln-cache/29.1-0000000000"
          [ "$(ls "$HOME/.config/emacs/eln-cache" | wc -l)" -eq 1 ]
          grep -q 'pruned eln-cache/29.1-0000000000' "${XDG_CACHE_HOME:-$HOME/.cache}/emacs-camp/sync.log"
      - name: Legacy ~/.emacs(.d) recurring and as symlinks
        run: python3 ci/test_activation.py
      - name: macOS .eln vetting cost (why the warm-up exists)
        if: runner.os == 'macOS'
        run: ./ci/eln-vetting.sh

  # emacs-camp next to agent-camp, as a downstream with both would deploy
  # them: claude, codex, pi and goose with their ACP adapters. agent-shell
  # then starts each with its own config and completes the ACP initialize
  # exchange (no account needed; the round trip with a key is the job below).
  agents:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Deploy emacs-camp + agent-camp onto the runner
        run: ECAMP_WITH_AGENTS=1 ./ci/e2e-deploy.sh
      - name: agent-shell starts each agent (ACP initialize)
        run: PATH="$AGENT_CAMP_PATH" "$EMACS" --batch --init-directory "$HOME/.config/emacs" -l ci/acp-handshake.el claude codex pi goose

  # agent-shell talking to the actual Claude Code ACP adapter. Needs the
  # ANTHROPIC_API_KEY secret, so it never runs for pull requests from forks.
  agent-shell-claude:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        if: env.ANTHROPIC_API_KEY != ''
      - uses: DeterminateSystems/nix-installer-action@v23
        if: env.ANTHROPIC_API_KEY != ''
      - name: Emacs from basecamp
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          nix build .#emacs -o "$RUNNER_TEMP/emacs"
          echo "$RUNNER_TEMP/emacs/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        if: env.ANTHROPIC_API_KEY != ''
      - name: Real agent round trip
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          bun add -g @agentclientprotocol/claude-agent-acp
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.bun/bin:$PATH"
          d="$RUNNER_TEMP/emacs.d"; mkdir -p "$d"; cp lisp/*.el "$d/"
          emacs --batch --init-directory "$d" -l sync.el
          ECAMP_E2E_AGENT=claude emacs --batch --init-directory "$d" -l ci/agent-shell-e2e.el
      - name: Skipped (no ANTHROPIC_API_KEY secret)
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "::notice::agent-shell-claude skipped; add the ANTHROPIC_API_KEY repository secret to run it"
